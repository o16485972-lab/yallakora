name: تحديث النسخة الثابتة

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/kora-next/package-lock.json

      - name: تثبيت الحزم
        working-directory: src/kora-next
        run: npm ci

      - name: بناء النسخة الثابتة من نفس تطبيق Next
        working-directory: src/kora-next
        env:
          KORA_STATIC: '1'
          NEXT_PUBLIC_SITE_URL: 'https://yallakora.mooo.com'
          NEXT_PUBLIC_API_BASE: 'https://yallaakora.vercel.app'
        run: |
          mv -f cloudflare.config.ts cloudflare.config.ts.bak || true
          npx vite build --config vite.static.config.ts

      - name: نشر الملفات في جذر الموقع
        run: |
          rm -rf _next 404 404.html matches news sources index.html index.txt manifest.webmanifest offline.html sw.js icon.svg vinext-client-entry-manifest.json .vite
          cp -R src/kora-next/dist/client/. .
          rm -rf .vite src/kora-next/dist

      - name: حفظ التغييرات
        run: |
          git config user.name "yallaakora bot"
          git config user.email "bot@yallaakora.local"
          git add -A
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات اليوم"
          else
            git commit -m "Refresh static export $(date -u +%F)"
            git push
          fi
